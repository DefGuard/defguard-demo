name: Build current image
permissions:
  contents: read
  id-token: write
  packages: write
on:
  push:
    branches:
      - dev
      - "release/**"
      - "stable/**"
    paths-ignore:
      - "*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
